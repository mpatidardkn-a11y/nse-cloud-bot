name: Top 10 every 15 min (market hours)
on:
  schedule:
    - cron: "5,20,35,50 4-9 * * 1-5"   # 09:35, 09:50 ... 15:20 IST Mon-Fri (UTC cron)
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nse-bot
  cancel-in-progress: false
jobs:
  top10:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and email top 10
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python bot.py run ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
