name: Manual test - top 10
on:
  workflow_dispatch:             # also started on the dot by an external timer (cron-job.org)
    inputs:
      force:
        description: "Ignore the market-hours / holiday check (manual test)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nse-bot
  cancel-in-progress: false
jobs:
  top10:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and email top 10
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python bot.py run ${{ inputs.force && '--force' || '' }}
