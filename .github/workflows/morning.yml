name: Morning analysis (8:00 IST)
on:
  schedule:
    - cron: "25 2 * * 1-5"      # 07:55 IST Mon-Fri (GitHub cron is UTC); report reaches you around 8:00
  workflow_dispatch:
    inputs:
      force:
        description: "Run even on a holiday (manual test)"
        type: boolean
        default: false          # "Run workflow" button for a manual test
permissions:
  contents: write
concurrency:
  group: nse-bot
  cancel-in-progress: false
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyse market and email report
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python bot.py morning ${{ inputs.force && '--force' || '' }}
      - name: Save today's setup list for the 15-minute runs
        run: |
          git config user.name "nse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trader/daily.json trader/plan.json
          git diff --cached --quiet || git commit -m "Setups for $(TZ=Asia/Kolkata date +%F)"
          git push
